<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!--
      CSP défense en profondeur (template famille).
      connect-src : 'self' (backend même origine) + l'origine du proxy Supabase
      AJOUTÉE au build depuis VITE_SUPABASE_PROXY (mode réel local-first, cf.
      vite.config — le PAT transite alors vers ce proxy). En démo/mock (Pages
      sans proxy), reste 'self' : aucun appel réseau de données.
      'unsafe-inline' requis : script anti-FOUC + styles Tailwind 4 / SW.
      Pas de 'unsafe-eval' : Zod tourne en mode « jitless » (script ci-dessous).
      `frame-ancestors` retiré : directive HEADER-ONLY, ignorée en <meta> (et non
      configurable sur GitHub Pages) — laissait juste un avertissement console.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />

    <!-- Zod en mode « jitless » (aucun `new Function`) AVANT son chargement :
         compatible CSP stricte sans 'unsafe-eval'. Cf. zod $ZodConfig.jitless. -->
    <script>
      globalThis.__zod_globalConfig = { jitless: true };
    </script>

    <!-- Script anti-FOUC : applique le thème avant tout rendu (clé alignée useTheme). -->
    <script>
      (function () {
        try {
          var v = localStorage.getItem('dwc_theme');
          var eff =
            v === 'light' || v === 'dark'
              ? v
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', eff);
          document.documentElement.style.colorScheme = eff;
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0c1222" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Miss Supaboss" />

    <meta
      name="description"
      content="Pilotage multi-comptes Supabase Free : inventaire des projets, pause / restauration à la demande, suivi des quotas Free Plan et préparation de démo."
    />
    <title>Miss Supaboss</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
