<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- CSP injectée au build par cspPlugin (@mister-guiiug/dev-wpa-config/vite-csp) :
         script-src par hash SHA-256 des 3 scripts inline ci-dessous (frame-buster,
         zod jitless, anti-FOUC), plus de 'unsafe-inline'. connect-src étend 'self'
         avec l'origine du proxy Supabase (VITE_SUPABASE_PROXY) au build — cf.
         vite.config. frame-ancestors omis (header-only ; frame-buster JS ci-dessous). -->

    <!-- Referrer-Policy : honoré par les navigateurs via <meta name="referrer">
         (cf. WHATWG HTML, "referrer policy delivery"). Remplace un en-tête
         non posable sur GitHub Pages. -->
    <meta name="referrer" content="no-referrer" />

    <!-- Frame-buster anti-clickjacking : `X-Frame-Options` et CSP
         `frame-ancestors` étant des directives HEADER-ONLY (ignorées en <meta>
         et non configurables sur GitHub Pages), on casse l'embed iframe en JS
         dès le head — défense en profondeur, exécutée avant tout rendu. -->
    <script>
      (function () {
        if (window.top !== window.self) {
          try {
            window.top.location.replace(window.self.location.href);
          } catch (e) {
            // Cross-origin top : on neutralise la page (l'attaquant ne peut plus
            // l'utiliser comme leurre derrière son overlay).
            document.documentElement.innerHTML = '';
          }
        }
      })();
    </script>

    <!-- Zod en mode « jitless » (aucun `new Function`) AVANT son chargement :
         compatible CSP stricte sans 'unsafe-eval'. Cf. zod $ZodConfig.jitless. -->
    <script>
      globalThis.__zod_globalConfig = { jitless: true };
    </script>

    <!-- Script anti-FOUC : applique le thème avant tout rendu (clé alignée useTheme). -->
    <script>
      (function () {
        try {
          var v = localStorage.getItem('dwc_theme');
          var eff =
            v === 'light' || v === 'dark'
              ? v
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', eff);
          document.documentElement.style.colorScheme = eff;
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0c1222" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Miss Supaboss" />

    <meta
      name="description"
      content="Pilotage multi-comptes Supabase Free : inventaire des projets, pause / restauration à la demande, suivi des quotas Free Plan et préparation de démo."
    />
    <title>Miss Supaboss</title>
    <!-- SEO/partage : __SEO_HOME_URL__ et __SEO_LOGO_URL__ sont remplis au
         build par pwaSeoPlugin() (vite.config.ts). -->
    <link rel="canonical" href="__SEO_HOME_URL__" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Miss Supaboss" />
    <meta
      property="og:description"
      content="Pilotage multi-comptes Supabase Free : inventaire des projets, pause / restauration à la demande, suivi des quotas Free Plan et préparation de démo."
    />
    <meta property="og:url" content="__SEO_HOME_URL__" />
    <meta property="og:image" content="__SEO_LOGO_URL__" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
