# CI déléguée au reusable workflow famille (dev-pwa-config).
#
# `e2e-grep` doit couvrir TOUTES les specs du dépôt : Playwright rend
# « No tests found » avec un code 0 pour une spec que le filtre ignore. Le
# filtre a valu `@critical` seul, et `e2e/a11y.spec.ts` (`@a11y accessibilité`,
# axe-core WCAG A/AA) n'a donc jamais été jouée en CI — un job vert qui ne
# vérifiait pas l'accessibilité. Ajouter `|@a11y` à ce filtre en même temps
# qu'une spec taguée autrement.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  ci:
    uses: mister-guiiug/dev-pwa-config/.github/workflows/pwa-ci.yml@v6
    # PAS de `secrets: inherit` : ce workflow n'en déclare aucun, et
    # `GITHUB_TOKEN` lui est fourni d'office. Hériter enverrait TOUS les
    # secrets du dépôt à un workflow qui n'en demande pas un seul.
    with:
      run-doctor: true # la checklist du parc, lue sur le dépôt et sur dist/
      # Strict dès que défauts ET dettes sont à 0 (SEO, manifeste absolu,
      # chunk sentry stable, servedContent/jsonLd). Les `info` restent informatifs.
      doctor-strict: true
      # Les seuils de `vitest.config.ts` ne sont VÉRIFIÉS que si la CI
      # joue `--coverage` : sans cette entrée Vitest ne mesure rien,
      # donc ne compare rien, et le job sort vert. Relevé du 13/09/2026 :
      # six dépôts déclaraient des seuils, UN SEUL les jouait.
      run-coverage: true
      # Le build CI mesure le preload AVEC les vars de prod (même forme que
      # Deploy) — sinon le plafond `preloadGzipKb` ne casse qu'au Deploy
      # (#153). Valeurs vides = skip injection, mais les clés restent alignées.
      build-env: |
        VITE_MOCK=1
        VITE_POSTHOG_KEY=${{ vars.VITE_POSTHOG_KEY }}
        VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
        VITE_SUPABASE_PROXY=${{ vars.VITE_SUPABASE_PROXY }}
      run-e2e: true
      # Ni `e2e-grep` ni `e2e-project` : les deux ne faisaient que recopier le
      # défaut du socle (`@critical|@a11y` et `chromium`). Recopié, un défaut
      # est FIGÉ — le jour où le socle élargit le filtre, la ligne locale l'en
      # empêche sans rien dire. Une valeur ici signifie « ce dépôt diverge »,
      # et rien d'autre : cf. miss-badminton, qui joue `.*` avec sa raison.
      # Second avis TypeScript 7, NON BLOQUANT. La 6 reste la référence : c'est
      # elle que typescript-eslint résout, et il refuse la 7.0 par une assertion
      # à l'import. Le jour où typescript-eslint#10940 se ferme, cette entrée
      # et l'alias `typescript-7` disparaissent ensemble.
      run-type-check-7: true
