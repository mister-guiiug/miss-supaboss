# CI déléguée au reusable workflow famille (dev-pwa-config).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  ci:
    uses: mister-guiiug/dev-pwa-config/.github/workflows/pwa-ci.yml@v4
    secrets: inherit
    with:
      run-doctor: true # la checklist du parc, lue sur le dépôt et sur dist/ (AMELIORATIONS.md, T2)
      # Le build CI valide le bundle mock (même build que GitHub Pages).
      build-env: |
        VITE_MOCK=1
      run-e2e: true
      e2e-grep: '@critical'
      e2e-project: chromium
