# GitHub Pages héberge la PWA en mode mock par défaut (VITE_MOCK=1, aucun
# secret). Mode RÉEL local-first : définir la variable de dépôt
# SUPABASE_PROXY_URL (URL du Worker, cf. proxy/) → injectée en VITE_SUPABASE_PROXY.
# Vide = la PWA reste en démo (rien ne casse).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: read

jobs:
  deploy:
    uses: mister-guiiug/dev-wpa-config/.github/workflows/pwa-deploy.yml@v3
    secrets: inherit
    with:
      use-base-path: true
      build-env: |
        VITE_MOCK=1
        VITE_SUPABASE_PROXY=${{ vars.SUPABASE_PROXY_URL }}
