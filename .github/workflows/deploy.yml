# GitHub Pages héberge la PWA en mode mock par défaut (VITE_MOCK=1, aucun
# secret). Mode RÉEL local-first : définir la variable de dépôt
# SUPABASE_PROXY_URL (URL du Worker, cf. proxy/) → injectée en VITE_SUPABASE_PROXY.
# Vide = la PWA reste en démo (rien ne casse).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: read

jobs:
  deploy:
    uses: mister-guiiug/dev-pwa-config/.github/workflows/pwa-deploy.yml@v4
    # PAS de `secrets: inherit` : le seul secret déclaré par
    # `pwa-deploy.yml` est `FIREBASE_SERVICE_ACCOUNT_KEY`, et ce dépôt ne
    # déploie pas sur Firebase. Hériter enverrait TOUS les secrets du dépôt
    # à un workflow qui n'en attend aucun ici.
    with:
      use-base-path: true
      build-env: |
        VITE_MOCK=1
        VITE_SUPABASE_PROXY=${{ vars.SUPABASE_PROXY_URL }}
