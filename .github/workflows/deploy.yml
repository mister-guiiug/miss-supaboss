# GitHub Pages héberge la PWA en mode mock par défaut (VITE_MOCK=1, aucun
# secret). Mode RÉEL local-first : définir la variable de dépôt
# VITE_SUPABASE_PROXY (URL du Worker, cf. proxy/). Vide = la PWA reste en
# démo (rien ne casse). Attention : depuis #135 le manifeste exige le même
# nom côté GitHub Actions et côté Vite — `SUPABASE_PROXY_URL` ne suffit plus.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: read

jobs:
  deploy:
    uses: mister-guiiug/dev-pwa-config/.github/workflows/pwa-deploy.yml@v6
    # PAS de `secrets: inherit` : le seul secret déclaré par
    # `pwa-deploy.yml` est `FIREBASE_SERVICE_ACCOUNT_KEY`, et ce dépôt ne
    # déploie pas sur Firebase. Hériter enverrait TOUS les secrets du dépôt
    # à un workflow qui n'en attend aucun ici.
    with:
      use-base-path: true
      # La garde « proxy in bundle » vit dans `npm run build`
      # (scripts/check-proxy-in-bundle.mjs) : si VITE_SUPABASE_PROXY est non
      # vide au build et absente du JS, le Deploy échoue avant Pages.
      build-env: |
        VITE_MOCK=1
        VITE_POSTHOG_KEY=${{ vars.VITE_POSTHOG_KEY }}
        VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
        VITE_SUPABASE_PROXY=${{ vars.VITE_SUPABASE_PROXY }}
